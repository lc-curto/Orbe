name: Web CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'web/**'
  pull_request:
    paths:
      - 'web/**'

permissions:
  contents: read

jobs:
  web:
    name: Lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Test financial route projection
        working-directory: web
        run: npm test
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: TypeScript and production build
        working-directory: web
        run: npm run build
