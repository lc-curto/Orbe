name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  backend:
    name: Laravel tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: orbe_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, pdo_mysql
          coverage: none
      - name: Prepare environment
        working-directory: backend
        run: cp .env.example .env
      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: Generate application key
        working-directory: backend
        run: php artisan key:generate --force
      - name: Check formatting of changed PHP files
        working-directory: backend
        run: vendor/bin/pint --test app/Http/Controllers/Api/FinancialRouteController.php app/Http/Controllers/Api/ReadController.php app/Services/CardInvoiceSummaryService.php app/Services/FinancialRouteReadService.php routes/api.php tests/Feature/FinancialRouteReadApiTest.php
      - name: Run backend tests
        working-directory: backend
        run: php artisan test
